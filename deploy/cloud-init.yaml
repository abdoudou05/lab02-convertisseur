#cloud-config
# Provisionnement initial de la VM (donné à Azure comme « custom data » à la création).
# Aucun secret ici : seulement la clé PUBLIQUE utilisée par GitHub Actions.
package_update: true
package_upgrade: true
packages:
  - nginx
  - certbot
  - python3-certbot-nginx
  - curl
  - unattended-upgrades

users:
  - default
  - name: deploy
    gecos: Compte de deploiement GitHub Actions
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGAd5+Gu3ArDA0xPcdTsD2hqyhwo6WtK3V7PZxNSy1yJ github-actions-deploy

write_files:
  # Durcissement SSH : clés seulement, pas de root, seulement les deux comptes prévus.
  - path: /etc/ssh/sshd_config.d/10-durcissement.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      MaxAuthTries 3
      AllowUsers azureuser deploy
  # Le compte deploy peut seulement redémarrer le service et lire ses journaux.
  - path: /etc/sudoers.d/deploy
    permissions: '0440'
    content: |
      deploy ALL=(root) NOPASSWD: /usr/bin/systemctl restart convertisseur, /usr/bin/systemctl status convertisseur, /usr/bin/journalctl -u convertisseur *

runcmd:
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y nodejs
  - mkdir -p /opt/convertisseur/releases
  - chown -R deploy:deploy /opt/convertisseur
  - systemctl restart ssh
  - systemctl enable nginx
