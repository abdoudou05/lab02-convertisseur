# /etc/nginx/sites-available/convertisseur
# Certbot (--nginx --redirect) ajoute ensuite le bloc 443 et la redirection HTTP -> HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name convertisseur.abdou.contact;

    access_log /var/log/nginx/convertisseur.access.log;
    error_log  /var/log/nginx/convertisseur.error.log;

    client_max_body_size 64k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
